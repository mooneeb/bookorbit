name: BookOrbit
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  BookOrbit:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooneeb.bookorbit.private
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BookOrbit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Info.plist
      properties:
        NSLocalNetworkUsageDescription: Connect to your BookOrbit server on your private network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mooneeb.bookorbit.private.oidc
            CFBundleURLSchemes: [bookorbit-private]
  BookOrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BookOrbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooneeb.bookorbit.private.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BookOrbit:
    build:
      targets:
        BookOrbit: all
    test:
      gatherCoverageData: true
      targets: [BookOrbitUITests]
