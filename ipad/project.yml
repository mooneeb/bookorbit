name: BookOrbit
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  BookOrbit:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: EPUBReader
        type: folder
        buildPhase: resources
      - path: ../client/public/assets/foliate
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooneeb.bookorbit.private
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BookOrbit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Connect to your BookOrbit server on your private network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mooneeb.bookorbit.private.oidc
            CFBundleURLSchemes: [bookorbit-private]
  BookOrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BookOrbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooneeb.bookorbit.private.uitests
        GENERATE_INFOPLIST_FILE: YES
  BookOrbitReaderProof:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [BookOrbitApp.swift]
      - path: ReaderProof/Sources
      - path: EPUBReader
        type: folder
        buildPhase: resources
      - path: ReaderProof/EPUBProof
        type: folder
        buildPhase: resources
      - path: ../client/public/assets/foliate
        type: folder
        buildPhase: resources
    settings:
      base:
        BOOKORBIT_READER_PROOF_BUNDLE_IDENTIFIER: com.mooneeb.bookorbit.readerproof
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOKORBIT_READER_PROOF_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BookOrbit Reader Proof
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: ReaderProof/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Connect to your BookOrbit server on your private network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BookOrbitReaderProofUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReaderProof/UITests]
    dependencies:
      - target: BookOrbitReaderProof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooneeb.bookorbit.readerproof.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BookOrbit:
    build:
      targets:
        BookOrbit: all
    test:
      gatherCoverageData: true
      targets: [BookOrbitUITests]
  BookOrbitReaderProof:
    build:
      targets:
        BookOrbitReaderProof: all
    test:
      gatherCoverageData: true
      targets: [BookOrbitReaderProofUITests]
