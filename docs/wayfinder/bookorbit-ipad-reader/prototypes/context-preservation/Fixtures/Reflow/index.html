<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Text-following ink experiment</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fffdf6;
        --foreground: #24231f;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
      }
      foliate-view {
        display: block;
        width: 100%;
        height: 100%;
        margin-inline: auto;
      }
      #problem {
        position: absolute;
        inset: 16px;
        font: 18px system-ui;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <foliate-view></foliate-view>
    <div id="problem">Opening the sample EPUB…</div>
    <script>
      const reportLoadingError = (event) => {
        const detail =
          event.message ||
          event.reason?.message ||
          "A bundled reader file did not load.";
        const message = `The reading sample could not open. ${detail}`;
        document.querySelector("#problem").textContent = message;
        window.webkit?.messageHandlers?.reflow?.postMessage({
          type: "error",
          message,
        });
      };
      window.addEventListener("error", reportLoadingError, true);
      window.addEventListener("unhandledrejection", reportLoadingError);
    </script>
    <script type="module" src="./reader.js"></script>
  </body>
</html>
