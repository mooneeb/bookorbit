<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookOrbit: review one reading flow at a time</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.5 var(--font-sans, system-ui, sans-serif);
        color: var(--foreground, #27242d);
      }
      main {
        max-width: 900px;
        margin: auto;
      }
      h1 {
        font-size: 27px;
        line-height: 1.2;
        letter-spacing: -0.03em;
        margin: 8px 0 12px;
      }
      h2 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted,
      small {
        color: var(--muted-foreground, #696570);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted-foreground, #696570);
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--border, #d8d4df);
        background: var(--card, #fff);
        border-radius: 8px;
        padding: 10px 13px;
        min-height: 44px;
      }
      button:hover {
        background: var(--secondary, #f2eff7);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary,
      button[aria-pressed="true"] {
        background: var(--primary, #7355aa);
        color: var(--primary-foreground, #fff);
        border-color: transparent;
      }
      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--primary, #7355aa);
        outline-offset: 3px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .panel {
        padding: 20px;
        border: 1px solid var(--border, #d8d4df);
        border-radius: var(--radius, 12px);
        background: var(--card, #fcfbfe);
      }
      .spaced {
        margin-top: 20px;
      }
      .lead {
        font-size: 17px;
      }
      .how {
        padding-left: 22px;
        margin: 16px 0 20px;
      }
      .how li {
        padding: 3px 0;
      }
      .overview {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .overview button {
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .overview span {
        display: block;
      }
      .overview strong {
        display: block;
      }
      .progress {
        font-size: 13px;
        color: var(--muted-foreground, #696570);
      }
      progress {
        width: 130px;
        height: 8px;
        accent-color: var(--primary, #7355aa);
      }
      .topline {
        margin: 0 0 20px;
      }
      .aim {
        border-left: 3px solid var(--primary, #7355aa);
        padding-left: 12px;
      }
      .setup {
        font-size: 13px;
        color: var(--muted-foreground, #696570);
        margin-bottom: 12px;
      }
      .book {
        border: 1px solid var(--border, #d8d4df);
        border-radius: 12px;
        overflow: hidden;
        background: var(--secondary, #f2eff7);
      }
      .book-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border, #d8d4df);
        font-size: 13px;
      }
      .book-head strong {
        font-size: 14px;
      }
      .book-stage {
        padding: 18px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 12px;
        min-height: 220px;
        overflow: auto;
      }
      .paper {
        position: relative;
        flex: 0 0 auto;
        width: min(100%, 480px);
        min-height: 220px;
        padding: 22px 26px;
        background: var(--background, #fff);
        border: 1px solid var(--border, #ddd);
        border-radius: 4px;
      }
      .paper h3 {
        font:
          22px/1.3 Georgia,
          serif;
      }
      .paper p {
        font:
          18px/1.65 Georgia,
          serif;
        margin: 0 0 12px;
      }
      .paper p.quote.selected {
        background: var(--secondary, #eee8f7);
        outline: 2px solid var(--primary, #7355aa);
        outline-offset: 4px;
      }
      .paper.large p {
        font-size: 23px;
      }
      .paper .ink {
        position: absolute;
        width: 85%;
        height: 150px;
        left: 5%;
        top: 95px;
        pointer-events: none;
      }
      .ink path,
      .ink polyline {
        fill: none;
        stroke: var(--primary, #7355aa);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink .wide {
        stroke-width: 17;
        opacity: 0.25;
      }
      .ink text {
        fill: var(--primary, #7355aa);
        font: italic 23px cursive;
      }
      .book-foot {
        padding: 12px 16px;
        background: var(--background, #fff);
        font-size: 13px;
        min-height: 45px;
        border-top: 1px solid var(--border, #d8d4df);
      }
      .badge {
        border-radius: 99px;
        padding: 3px 8px;
        background: var(--secondary, #ede9f4);
        font-size: 12px;
      }
      .note {
        width: min(100%, 420px);
        padding: 16px;
        border-radius: 10px;
        background: var(--background, #fff);
        border: 2px solid var(--primary, #7355aa);
      }
      .note .quote {
        font:

          serif;
        padding-left: 10px;
        border-left: 2px solid var(--border, #d8d4df);
      }
      .note svg {
        display: block;
        width: 100%;
        height: 120px;
      }
      .note textarea {
        width: 100%;
        min-height: 100px;
        padding: 10px;
        border: 1px solid var(--border, #d8d4df);
        background: var(--background, #fff);
        border-radius: 8px;
      }
      .palette {
        padding: 12px;
        background: var(--background, #fff);
        border: 2px solid var(--primary, #7355aa);
        border-radius: 12px;
      }
      .result {
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--secondary, #f2eff7);
        font-size: 14px;
      }
      .checklist {
        padding: 0;
        margin: 12px 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }
      .check-step {
        border: 1px solid var(--border, #d8d4df);
        border-radius: 10px;
        padding: 14px;
      }
      .check-step.current {
        border-color: var(--primary, #7355aa);
      }
      .check-step .number {
        font-size: 12px;
        color: var(--muted-foreground, #696570);
        margin-bottom: 4px;
      }
      .check-step p {
        margin: 4px 0 10px;
        font-size: 14px;
      }
      .check-step label {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 12px;
        font-size: 14px;
      }
      .check-step input {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        margin-top: 2px;
        accent-color: var(--primary, #7355aa);
      }
      .review textarea {
        display: block;
        width: 100%;
        min-height: 76px;
        padding: 12px;
        border: 1px solid var(--border, #d8d4df);
        border-radius: 8px;
        background: var(--background, #fff);
        margin-top: 10px;
      }
      .footer {
        margin: 20px 0 8px;
      }
      .completion {
        font-size: 14px;
        margin: 12px 0 0;
      }
      .choice {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .option {
        padding: 16px;
        border: 1px solid var(--border, #d8d4df);
        border-radius: 10px;
        background: var(--background, #fff);
      }
      .option svg {
        display: block;
        width: 100%;
        height: 78px;
      }
      .summary-list {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .summary-list li {
        padding: 12px 0;
        border-bottom: 1px solid var(--border, #d8d4df);
      }
      details {
        margin-top: 16px;
      }
      summary {
        cursor: pointer;
      }
      .export {
        width: 100%;
        min-height: 200px;
        padding: 14px;
        background: var(--background, #fff);
        border: 1px solid var(--border, #d8d4df);
        border-radius: 8px;
        font: 13px/1.5 var(--font-mono, monospace);
      }
      .pdf-window {
        height: 330px;
        width: 100%;
        overflow: auto;
        padding: 10px;
        background: var(--secondary, #f2eff7);
      }
      .pdf-window.landscape {
        height: 230px;
      }
      .pdf-page {
        margin: auto;
        width: 220px;
        background: var(--background, #fff);
        border: 1px solid var(--border, #d8d4df);
      }
      .pdf-page svg {
        width: 100%;
        display: block;
      }
      .pdf-page.zoomed {
        width: 330px;
      }
      .pdf-window.landscape .pdf-page {
        width: 150px;
      }
      .pdf-window.landscape .pdf-page.zoomed {
        width: 225px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 520px) {
        h1 {
          font-size: 24px;
        }
        .panel {
          padding: 16px;
        }
        .book-stage {
          padding: 12px;
        }
        .paper {
          padding: 18px;
        }
        .paper p {
          font-size: 16px;
        }
        .choice {
          grid-template-columns: 1fr;
        }
        .progress {
          max-width: 100%;
        }
        .row button {
          max-width: 100%;
        }
      }
      .trial-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .visual-column {
        position: sticky;
        top: 12px;
        min-width: 0;
      }
      .trial-layout .choice {
        grid-template-columns: 1fr;
      }
      .trial-layout h2 {
        font-size: 18px;
      }
      @media (max-width: 680px) {
        .trial-layout {
          grid-template-columns: 1fr;
        }
        .visual-column {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script id="walkthrough-model">
      const WalkthroughModel = (() => {
        const initial = (id) => ({
          id,
          tried: [false, false, false],
          checked: [false, false, false],
          stage: 0,
          verdict: null,
          comment: "",
          text: "",
          ink: false,
          noteOpen: false,
          closed: false,
          armed: false,
          choice: null,
          view: "original",
          extraOriginalInk: false,
          tool: "pen",
        });
        const complete = (s) =>
          s.checked.every(Boolean) &&
          (s.id === "entry" ? !!s.choice : !!s.verdict);
        const reduce = (state, action) => {
          const s = structuredClone(state);
          if (action.type === "RESET") return initial(s.id);
          if (action.type === "CHECK") {
            if (s.tried[action.index]) s.checked[action.index] = action.value;
            return s;
          }
          if (action.type === "VERDICT") {
            s.verdict = action.value;
            return s;
          }
          if (action.type === "COMMENT") {
            s.comment = action.value;
            return s;
          }
          if (action.type === "TEXT") {
            s.text = action.value;
            return s;
          }
          if (action.type === "CHOICE") {
            s.choice = action.value;
            return s;
          }
          if (action.type === "VIEW") {
            s.view = action.value;
            return s;
          }
          if (action.type === "EDIT_ORIGINAL") {
            s.view = "original";
            s.extraOriginalInk = true;
            return s;
          }
          if (action.type !== "TRY") return s;
          const n = action.index;
          if (n > 0 && !s.tried[n - 1]) return s;
          if (s.id === "linked") {
            if (n === 0) {
              s.stage = 1;
              s.tried[0] = true;
            }
            if (n === 1 && !s.noteOpen) {
              s.noteOpen = true;
              s.stage = 2;
            } else if (n === 1) {
              s.ink = true;
              s.tried[1] = true;
            }
            if (n === 2 && !s.closed) {
              s.noteOpen = false;
              s.closed = true;
              s.stage = 3;
            } else if (n === 2) {
              s.noteOpen = true;
              s.tried[2] = true;
            }
            return s;
          }
          if (s.id === "typed") {
            if (n === 0) {
              s.noteOpen = true;
              s.stage = 1;
              s.tried[0] = true;
            }
            if (n === 1) {
              s.text =
                "Look again: the small details change the whole journey.";
              s.stage = 2;
              s.tried[1] = true;
            }
            if (n === 2 && !s.closed) {
              s.noteOpen = false;
              s.closed = true;
              s.stage = 3;
            } else if (n === 2) {
              s.noteOpen = true;
              s.tried[2] = true;
            }
            return s;
          }
          if (s.id === "entry" && n === 2 && !s.armed) {
            s.armed = true;
            return s;
          }
          if (s.id === "finger" && n === 2 && !s.armed) {
            s.armed = true;
            return s;
          }
          s.stage = n + 1;
          s.tried[n] = true;
          if (s.id === "page") s.ink = true;
          if (s.id === "epub") s.view = n === 1 ? "original" : "larger";
          if (s.id === "palette") s.tool = n > 0 ? "highlighter" : "pen";
          if (s.id === "undo") s.tool = "eraser";
          return s;
        };
        return { initial, reduce, complete };
      })();
    </script>
    <script id="review-shell">
      const quote =
        "A useful note keeps a question alive long enough for a different answer to appear.";
      const scribble =
        "Look again: the small details change the whole journey.";
      const scenarios = [
        {
          id: "page",
          title: "Write on a page, then read the ink later",
          aim: "Check that you can find and reopen handwriting after returning to reading.",
          setup:
            "An EPUB passage is open. The sample mark stands in for your Pencil handwriting.",
          steps: [
            {
              label: "Add some page ink",
              action: "Write a sample mark",
              expect: "A purple handwritten mark appears over the passage.",
              check: "I saw ink appear over the page.",
            },
            {
              label: "Return to reading",
              action: "Return to reading",
              expect:
                "Normal reading returns, with a marker for the annotated page.",
              check: "I found the marker for my saved page ink.",
            },
            {
              label: "Read the ink again",
              action: "Open the saved page",
              expect: "The original page opens with the same handwriting.",
              check: "I reopened the page and could see the same ink.",
            },
          ],
        },
        {
          id: "linked",
          title: "Keep a handwritten note beside a passage",
          aim: "Check that a separate ink note stays connected to the passage you selected.",
          setup:
            "A fresh EPUB passage is ready. This note will be separate from writing over the book page.",
          steps: [
            {
              label: "Choose the passage",
              action: "Select this passage",
              expect: "The quote is selected as the context for your note.",
              check: "I could tell which passage the note belongs to.",
            },
            {
              label: "Write the linked note",
              action: "Create an ink note",
              expect:
                "Open the note, then add the supplied handwriting inside it.",
              check:
                "I wrote inside a separate note, with the quote still visible.",
            },
            {
              label: "Find it again",
              action: "Close the ink note",
              expect:
                "Close it, then reopen it from its passage marker. Its ink should still be there.",
              check: "I reopened the linked note and found its handwriting.",
            },
          ],
        },
        {
          id: "typed",
          title: "Turn handwriting input into a typed note",
          aim: "Check the flow for a typed note entered through Scribble, then reopened later.",
          setup:
            "A passage is already selected. The Scribble button inserts sample text; you can edit that text with your keyboard.",
          limit:
            "This checks the text-note flow. Actual Scribble recognition needs an iPad.",
          steps: [
            {
              label: "Open a text note",
              action: "Open a typed note",
              expect:
                "An editable text field opens with the passage quote above it.",
              check: "I found an editable text field linked to the quote.",
            },
            {
              label: "Enter text through Scribble",
              action: "Simulate Scribble input",
              expect:
                "Sample handwriting becomes editable text. Try changing a word if you like.",
              check: "I saw editable text appear in the note.",
            },
            {
              label: "Read the note again",
              action: "Close the typed note",
              expect:
                "Close the note, then reopen it. The text, including any edits, should remain.",
              check: "I reopened the note and found my text.",
            },
          ],
        },
        {
          id: "epub",
          title: "Change EPUB text size without losing page ink",
          aim: "Check that old ink keeps its original page, while a new layout can have its own ink.",
          setup:
            "This EPUB already has an annotated page. Its supplied handwriting is your starting point.",
          steps: [
            {
              label: "Make reading text larger",
              action: "Enlarge the reading text",
              expect:
                "Reading text reflows. A marker points to the earlier annotated page.",
              check: "I saw larger reading text and a marker for the old ink.",
            },
            {
              label: "Revisit the old layout",
              action: "Open the earlier annotated page",
              expect:
                "The original text size and its handwriting return together.",
              check: "I could read the earlier ink in its original layout.",
            },
            {
              label: "Write in the new layout",
              action: "Write on the larger layout",
              expect:
                "A second annotated page is created. Switch between Original and Larger below the book to compare them.",
              check:
                "I compared both annotated pages and could distinguish their ink.",
            },
          ],
        },
        {
          id: "pdf",
          title: "Keep PDF ink aligned while zooming and rotating",
          aim: "Check that a mark stays over the same PDF content when its display changes.",
          setup:
            "A fixed PDF page already has a purple circle around the word Observation.",
          steps: [
            {
              label: "Zoom the PDF",
              action: "Zoom in",
              expect: "The page and its circle grow together.",
              check:
                "I checked that the circle stayed around Observation after zooming.",
            },
            {
              label: "Rotate the iPad",
              action: "Rotate to landscape",
              expect:
                "The viewing area becomes wider. The PDF page keeps its shape and mark placement.",
              check: "I checked that the mark stayed aligned after rotation.",
            },
            {
              label: "Fit the whole page",
              action: "Fit the page",
              expect:
                "The whole page fits again, with the same circle in place.",
              check: "I checked the circle again with the page fitted.",
            },
          ],
        },
        {
          id: "entry",
          title: "Choose how page writing should begin",
          aim: "Compare Pencil contact with tapping Write first, then choose the one you prefer.",
          setup:
            "Two fresh copies of the same passage are provided. Only the way writing starts differs.",
          steps: [
            {
              label: "Try immediate writing",
              action: "Touch option A with the Pencil",
              expect: "Option A enters writing and makes a mark immediately.",
              check: "I tried starting a mark with Pencil contact alone.",
            },
            {
              label: "Try the protected reading page",
              action: "Touch option B with the Pencil",
              expect: "Option B stays in reading, without making a mark.",
              check:
                "I tried Pencil contact before tapping Write and saw no mark.",
            },
            {
              label: "Enter writing explicitly",
              action: "Tap Write in option B",
              expect:
                "Tap Write, then touch the page with the Pencil. Only then does a mark appear.",
              check: "I tapped Write and then made a mark in option B.",
            },
          ],
        },
        {
          id: "finger",
          title: "Avoid accidental page turns while writing",
          aim: "Check whether returning to Read before turning pages feels natural.",
          setup:
            "A fresh EPUB page is ready. This example only tests finger navigation during page writing.",
          steps: [
            {
              label: "Begin writing",
              action: "Add a sample Pencil mark",
              expect: "Page writing starts, with ink on page 1.",
              check: "I could tell that page writing was active.",
            },
            {
              label: "Try a finger page turn",
              action: "Try turning the page with a finger",
              expect:
                "Page 1 stays in place. While writing, fingers are reserved for moving or zooming the content.",
              check:
                "I tried a finger page turn and the writing page stayed put.",
            },
            {
              label: "Resume reading navigation",
              action: "Return to Read",
              expect:
                "Return to Read, then try the finger page turn again. This time page 2 should open.",
              check: "I returned to Read and could turn to page 2.",
            },
          ],
        },
        {
          id: "palette",
          title: "Choose a drawing tool using squeeze",
          aim: "Check whether a small tool palette is a useful response to Pencil squeeze.",
          setup:
            "Page writing is already active. The supplied squeeze button stands in for the Pencil gesture.",
          limit:
            "Squeeze is simulated. Native behavior must follow supported APIs and the iPad system settings.",
          steps: [
            {
              label: "Open the tools",
              action: "Simulate Pencil squeeze",
              expect: "A small drawing-tool palette opens beside the passage.",
              check: "I found the tool palette after squeeze.",
            },
            {
              label: "Choose a highlighter",
              action: "Choose Highlighter",
              expect:
                "Highlighter becomes the selected tool and the palette closes.",
              check: "I could tell Highlighter was selected.",
            },
            {
              label: "Use the chosen tool",
              action: "Add a sample highlight",
              expect: "A broad translucent mark appears over the passage.",
              check: "I saw the highlighter make a different mark from a pen.",
            },
          ],
        },
        {
          id: "undo",
          title: "Erase a mark, then undo the mistake",
          aim: "Check that switching to an eraser and recovering a mark are easy to follow.",
          setup:
            "A page already has a purple handwritten mark. Pen is initially selected.",
          limit:
            "Double-tap is simulated with its system action set to switch between tool and eraser.",
          steps: [
            {
              label: "Switch to the eraser",
              action: "Simulate Pencil double-tap",
              expect: "Eraser becomes the selected tool.",
              check: "I could tell that double-tap selected Eraser.",
            },
            {
              label: "Erase the ink",
              action: "Erase the sample mark",
              expect: "The handwriting disappears from the page.",
              check: "I saw the mark disappear after erasing it.",
            },
            {
              label: "Recover the mark",
              action: "Undo the erasing",
              expect: "The same handwriting comes back.",
              check: "I restored the erased handwriting with Undo.",
            },
          ],
        },
        {
          id: "offline",
          title: "Write offline, then see the note sync",
          aim: "Check that offline saving and later synchronization are understandable.",
          setup:
            "A downloaded EPUB is open and the server is initially reachable. Sync acknowledgements are simulated.",
          steps: [
            {
              label: "Lose the server connection",
              action: "Go offline",
              expect: "The book stays open, with an Offline indication.",
              check: "I could still read the downloaded book while offline.",
            },
            {
              label: "Write without a connection",
              action: "Write a note while offline",
              expect:
                "Ink appears and is labelled Saved on this iPad, waiting to sync.",
              check:
                "I could tell the note was kept locally and had not synced yet.",
            },
            {
              label: "Reconnect",
              action: "Reconnect to the server",
              expect:
                "The same note remains, and its status changes to Synced in this simulation.",
              check: "I saw the note stay intact when pending sync completed.",
            },
          ],
        },
      ];
      let states = Object.fromEntries(
        scenarios.map((s) => [s.id, WalkthroughModel.initial(s.id)]),
      );
      let current = null;
      let showReview = false;
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ink = (extra = false, wide = false) =>
        `<svg class="ink" viewBox="0 0 400 140" aria-label="Purple handwriting"><path ${wide ? 'class="wide"' : ""} d="M22 38 Q92 16 174 40 T330 37 M56 67 Q143 84 293 61"/>${wide ? "" : `<path d="M296 64 Q352 91 354 120 M342 109 L354 120 L364 105"/><text x="128" y="126">come back to this</text>`}${extra ? '<path d="M28 102 L50 118 L85 83"/>' : ""}</svg>`;
      const paper = (
        s,
        {
          draw = false,
          large = false,
          selected = false,
          second = false,
          extra = false,
          wide = false,
        } = {},
      ) =>
        `<div class="paper ${large ? "large" : ""}"><h3>${second ? "A second look" : "A place to return to"}</h3><p class="quote ${selected ? "selected" : ""}">${second ? "The next morning I returned to the same path and noticed something I had missed." : quote}</p><p>${second ? "There was room for another question." : "I stopped here to keep a thought before continuing with the chapter."}</p>${draw ? ink(extra, wide) : ""}</div>`;
      function bookFrame(title, badge, content, foot) {
        return `<div class="book"><div class="book-head row between"><strong>${title}</strong><span class="badge">${badge}</span></div><div class="book-stage">${content}</div><div class="book-foot">${foot}</div></div>`;
      }
      function noteContent(s, typed) {
        return `<div class="note"><strong>${typed ? "Typed" : "Ink"} note</strong><p class="quote">${quote}</p>${typed ? `<label for="noteText"><small>Your editable note</small></label><textarea id="noteText" placeholder="Your text appears here">${esc(s.text)}</textarea>` : `<svg class="ink" style="position:static" viewBox="0 0 400 140" aria-label="Handwriting inside the linked note">${s.ink ? '<path d="M30 40 Q110 14 190 45 T350 40 M72 75 Q170 92 310 65"/><text x="80" y="120">why does this matter?</text>' : ""}</svg><small>${s.ink ? "Editable handwriting kept with this quote." : "A blank space for your handwriting."}</small>`}</div>`;
      }
      function visual(c, s) {
        const n = s.stage;
        if (c.id === "page")
          return bookFrame(
            "EPUB · Practice book",
            n === 1 ? "Writing" : n === 3 ? "Saved annotated page" : "Reading",
            paper(s, { draw: n === 1 || n === 3 }),
            n === 2
              ? "Saved page ink · 1 annotated page for this passage"
              : n === 3
                ? "Original page and its handwriting reopened."
                : n === 1
                  ? "Ink is on this page."
                  : "Your practice passage is ready.",
          );
        if (c.id === "linked" || c.id === "typed")
          return bookFrame(
            "EPUB · This passage",
            s.noteOpen ? "Note open" : "Reading",
            s.noteOpen
              ? noteContent(s, c.id === "typed")
              : paper(s, { selected: n > 0 }),
            s.closed && !s.noteOpen
              ? "Note marker · 1 note linked to this quote"
              : s.noteOpen
                ? "The note belongs to the quote shown above it."
                : n > 0
                  ? "Passage selected for a linked note."
                  : "Select a passage using step 1 below.",
          );
        if (c.id === "epub") {
          const old = n === 0 || s.view === "original";
          const controls =
            n === 3
              ? `<div class="row"><button data-view="original" aria-pressed="${s.view === "original"}">Original annotated page</button><button data-view="larger" aria-pressed="${s.view === "larger"}">Larger annotated page</button>${s.view === "original" ? "<button data-edit-original>Edit original ink: add a mark</button>" : ""}</div>`
              : "";
          return bookFrame(
            "EPUB · One passage, preserved layouts",
            n === 1
              ? "Larger reading text"
              : old
                ? "Original annotated page"
                : "Larger annotated page",
            paper(s, {
              draw: n !== 1,
              large: !old,
              extra: old ? s.extraOriginalInk : true,
            }),
            n === 1
              ? "Earlier page ink · 1 annotated page at the original size"
              : controls ||
                  "This is the earlier page with its original handwriting.",
          );
        }
        if (c.id === "pdf")
          return bookFrame(
            "PDF · Field observations",
            n >= 2 ? "Landscape" : "Portrait",
            `<div class="pdf-window ${n >= 2 ? "landscape" : ""}"><div class="pdf-page ${n === 1 || n === 2 ? "zoomed" : ""}"><svg viewBox="0 0 600 800" role="img" aria-label="PDF page with a purple circle around Observation"><g fill="currentColor" font-family="Georgia,serif"><text x="60" y="100" font-size="32">Field observations</text><text x="60" y="160" font-size="23">A fixed page with a marked detail.</text><rect x="65" y="235" width="470" height="160" fill="var(--secondary,#f2eff7)"/><text x="160" y="325" font-size="34">Observation</text><text x="60" y="465" font-size="23">Keep the mark with this content.</text><text x="300" y="750" font-size="18">1</text></g><ellipse cx="270" cy="314" rx="155" ry="58" fill="none" stroke="var(--primary,#7355aa)" stroke-width="5" transform="rotate(-5,270,314)"/></svg></div></div>`,
            n === 3
              ? "Whole page fitted. The circle still surrounds Observation."
              : n === 2
                ? "Landscape viewing area. Scroll inside the PDF if needed."
                : n === 1
                  ? "Zoomed page. Page content and ink use the same scale."
                  : "The purple circle is supplied so you can check its alignment.",
          );
        if (c.id === "entry")
          return bookFrame(
            "EPUB · Compare writing entry",
            "Two isolated options",
            `<div class="choice"><div class="option"><strong>A · Pencil contact</strong><p>Reading → writing on contact.</p><svg class="ink" style="position:static" viewBox="0 0 400 140">${s.tried[0] ? '<path d="M25 40 Q140 10 320 45"/><text x="45" y="100">a thought</text>' : ""}</svg><small>${s.tried[0] ? "Writing · mark created." : "Reading · no ink yet."}</small></div><div class="option"><strong>B · Write button first</strong><p>Reading stays protected.</p><svg class="ink" style="position:static" viewBox="0 0 400 140">${s.tried[2] ? '<path d="M25 40 Q140 10 320 45"/><text x="45" y="100">a thought</text>' : ""}</svg><small>${s.tried[2] ? "Writing · mark created." : s.armed ? "Write selected · ready for Pencil." : s.tried[1] ? "Reading · Pencil made no mark." : "Reading · no ink yet."}</small></div></div>`,
            s.tried[2]
              ? "You have now tried both entry behaviors. Choose your preference below."
              : "Use the numbered steps below to try each option.",
          );
        if (c.id === "finger")
          return bookFrame(
            "EPUB · Practice book",
            n === 0 || (s.armed && !s.tried[2])
              ? "Reading · page 1"
              : n < 3
                ? "Writing · page 1"
                : "Reading · page 2",
            paper(s, {
              draw: (n === 1 || n === 2) && !s.armed,
              second: s.tried[2],
            }),
            s.armed && !s.tried[2]
              ? "Read selected. Now try the finger page turn in step 3."
              : n === 2
                ? "Finger page-turn attempt: page 1 stayed put. Fingers are reserved for pan/zoom while writing."
                : s.tried[2]
                  ? "Read was selected, then the finger page turn opened page 2."
                  : "Follow the steps below to compare finger navigation while writing and reading.",
          );
        if (c.id === "palette")
          return bookFrame(
            "EPUB · Page writing",
            `Selected tool: ${s.tool}`,
            n === 1
              ? `<div class="palette"><strong>Drawing tools</strong><p>Choose Highlighter here or in step 2.</p><div class="row"><button disabled>Pen (selected)</button><button data-try="1">Highlighter</button></div></div>`
              : paper(s, { draw: n === 3, wide: true }),
            n === 1
              ? "The squeeze gesture opened this palette."
              : n >= 2
                ? "Highlighter selected. The palette has closed."
                : "Page writing is active; the drawing tools are initially tucked away.",
          );
        if (c.id === "undo")
          return bookFrame(
            "EPUB · Page writing",
            `Selected tool: ${s.tool}`,
            paper(s, { draw: n !== 2 }),
            n === 2
              ? "Mark erased. Undo can restore it."
              : n === 3
                ? "Undo restored the original handwriting."
                : n === 1
                  ? "Double-tap selected Eraser. The mark is still here until you erase it."
                  : "The sample mark is ready for you to erase.",
          );
        return bookFrame(
          "EPUB · Downloaded book",
          n === 0 || n === 3 ? "Server reachable" : "Offline",
          paper(s, { draw: n >= 2 }),
          n === 0
            ? "Book downloaded. Server reachable."
            : n === 1
              ? "Offline · the downloaded book remains readable."
              : n === 2
                ? "Saved on this iPad · 1 note waiting to sync."
                : "Synced (simulation) · the same note has been acknowledged.",
        );
      }
      function actionLabel(c, s, i) {
        if (c.id === "linked" && i === 1 && s.noteOpen)
          return s.ink
            ? "Write the sample note again"
            : "Add sample handwriting";
        if ((c.id === "linked" || c.id === "typed") && i === 2 && s.closed)
          return "Reopen the note";
        if (c.id === "entry" && i === 2 && s.armed)
          return "Make a Pencil mark in option B";
        if (c.id === "finger" && i === 2 && s.armed)
          return "Turn the page with a finger";
        return c.steps[i].action;
      }
      function reviewedCount() {
        return Object.values(states).filter(WalkthroughModel.complete).length;
      }
      function header() {
        return `<div class="row between topline"><button data-home>All scenarios</button><span class="progress">${reviewedCount()} of ${scenarios.length} reviewed <progress max="${scenarios.length}" value="${reviewedCount()}" aria-label="Scenarios reviewed"></progress></span></div>`;
      }
      function overview() {
        const first = scenarios.find(
          (c) => !WalkthroughModel.complete(states[c.id]),
        );
        return `<div class="eyebrow">Personal BookOrbit iPad app · interaction review</div><h1>How should reading and taking notes work?</h1><p class="lead">Try ten small scenarios, one at a time. Each answers one question about your future iPad reader.</p><ol class="how"><li>Read the scenario's aim.</li><li>Use its three steps and tick what you checked.</li><li>Choose <strong>Keep this flow</strong> or <strong>Change this flow</strong>.</li></ol><button class="primary" data-open="${first?.id || scenarios[0].id}">${reviewedCount() === 0 ? "Start scenario 1: write and revisit ink" : first ? "Continue with the next unfinished scenario" : "Revisit scenario 1"}</button><p class="progress spaced">${reviewedCount()} of ${scenarios.length} scenarios reviewed. Progress stays while this page is open.</p><p class="muted">Use your mouse. Sample marks stand in for Pencil handwriting. This review checks the reading and note flows; native Pencil feel needs an iPad.</p><details><summary>See all ten scenarios</summary><div class="overview">${scenarios.map((c, i) => `<button data-open="${c.id}"><span><strong>${i + 1}. ${c.title}</strong><small>${c.aim}</small></span><span class="badge">${WalkthroughModel.complete(states[c.id]) ? "Reviewed" : `${states[c.id].checked.filter(Boolean).length}/3 checked`}</span></button>`).join("")}</div></details><button class="spaced" data-summary>Review my results</button>`;
      }
      function activeCase() {
        const c = scenarios.find((c) => c.id === current),
          s = states[current],
          index = scenarios.indexOf(c),
          done = WalkthroughModel.complete(s);
        const nextStep = s.tried.findIndex((t) => !t);
        const result =
          s.stage === 0
            ? "Start with step 1. Everything you need for this scenario is on this page."
            : nextStep === -1
              ? "All three actions have been tried. Tick what you checked, then give this flow your reaction."
              : `Now try step ${nextStep + 1}. Tick each checkbox after checking its result.`;
        return `${header()}<div class="eyebrow">Scenario ${index + 1} of ${scenarios.length}</div><h1>${c.title}</h1><p class="aim"><strong>Aim:</strong> ${c.aim}</p><p class="setup">${c.setup}</p><div class="trial-layout spaced"><div class="visual-column">${visual(c, s)}<div class="result" role="status" aria-live="polite">${result}</div></div><section aria-label="Scenario checklist"><h2>Try these three things</h2><p class="muted">Tick each box after trying it, even if you want the behavior changed.</p><ol class="checklist">${c.steps.map((st, i) => `<li class="check-step ${i === nextStep ? "current" : ""}"><div class="number">Step ${i + 1}</div><h3>${st.label}</h3><p>${st.expect}</p><button data-try="${i}" ${i > 0 && !s.tried[i - 1] ? "disabled" : ""} ${i === nextStep ? 'class="primary"' : ""}>${esc(actionLabel(c, s, i))}</button><label><input type="checkbox" data-check="${i}" ${s.checked[i] ? "checked" : ""} ${!s.tried[i] ? "disabled" : ""}/><span>${st.check}</span></label></li>`).join("")}</ol></section></div><section class="panel review spaced" aria-label="Your reaction"><h2>${c.id === "entry" ? "Which way should writing begin?" : "Would you keep this flow?"}</h2>${c.id === "entry" ? `<div class="row"><button data-choice="contact" aria-pressed="${s.choice === "contact"}">A · Pencil contact</button><button data-choice="write" aria-pressed="${s.choice === "write"}">B · Write first</button></div>` : `<div class="row"><button data-verdict="keep" aria-pressed="${s.verdict === "keep"}">Keep this flow</button><button data-verdict="change" aria-pressed="${s.verdict === "change"}">Change this flow</button></div>`}<label for="feedback"><small>${s.verdict === "change" ? "What would you change?" : "Anything to add? (optional)"}</small></label><textarea id="feedback" placeholder="Tell me what felt awkward or what you would prefer.">${esc(s.comment)}</textarea><p class="completion">${done ? "Scenario reviewed. Your reaction is recorded in this page." : `${s.checked.filter(Boolean).length} of 3 checks ticked. ${c.id === "entry" ? (!s.choice ? "Choose your preferred entry behavior." : "") : !s.verdict ? "Choose Keep or Change." : ""}`}</p></section><div class="row between footer"><button data-reset>Restart only this scenario</button>${index < scenarios.length - 1 ? `<button class="primary" data-open="${scenarios[index + 1].id}" ${!done ? "disabled" : ""}>Next scenario: ${index + 2}</button>` : `<button class="primary" data-summary ${!done ? "disabled" : ""}>Review all results</button>`}</div>${c.limit ? `<p class="setup">${c.limit}</p>` : ""}`;
      }
      function verdict(c) {
        const s = states[c.id];
        return c.id === "entry"
          ? s.choice === "contact"
            ? "Prefer Pencil contact"
            : s.choice === "write"
              ? "Prefer Write first"
              : "No preference yet"
          : s.verdict === "keep"
            ? "Keep this flow"
            : s.verdict === "change"
              ? "Change this flow"
              : "No reaction yet";
      }
      function reviewText() {
        return (
          `BookOrbit reader interaction review\n${reviewedCount()} of ${scenarios.length} scenarios reviewed\n\n` +
          scenarios
            .map((c, i) => {
              const s = states[c.id];
              return `${i + 1}. ${c.title}\n${s.checked.filter(Boolean).length}/3 checks completed. ${verdict(c)}.${s.comment ? "\nFeedback: " + s.comment : ""}`;
            })
            .join("\n\n")
        );
      }
      function summary() {
        const done = reviewedCount() === scenarios.length;
        return `${header()}<h1>${done ? "Your interaction review is complete" : "Your review so far"}</h1><p>${done ? "You have tried every scenario and recorded a reaction to each flow." : "Choose any unfinished scenario below to continue."}</p><ul class="summary-list">${scenarios.map((c, i) => `<li><div class="row between"><div><strong>${i + 1}. ${c.title}</strong><br/><small>${states[c.id].checked.filter(Boolean).length}/3 checks · ${verdict(c)}</small></div><button data-open="${c.id}">${WalkthroughModel.complete(states[c.id]) ? "Revisit" : "Continue"}</button></div>${states[c.id].comment ? `<p>${esc(states[c.id].comment)}</p>` : ""}</li>`).join("")}</ul><section class="panel spaced"><h2>Share your review in this chat</h2><p>The review is kept on this page. Select the text below, copy it, and paste it into our conversation.</p><button data-select-review>Select review text</button><textarea class="export spaced" id="reviewText" readonly aria-label="Your review to copy">${esc(reviewText())}</textarea></section>`;
      }
      function render() {
        const focus = document.activeElement?.id;
        const start = document.activeElement?.selectionStart,
          end = document.activeElement?.selectionEnd;
        $("app").innerHTML = showReview
          ? summary()
          : current
            ? activeCase()
            : overview();
        if (focus && (focus === "noteText" || focus === "feedback")) {
          const el = $(focus);
          if (el) {
            el.focus({ preventScroll: true });
            el.setSelectionRange(start, end);
          }
        }
      }
      function dispatch(action) {
        states[current] = WalkthroughModel.reduce(states[current], action);
        render();
      }
      function goTop() {
        window.scrollTo(0, 0);
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || b.disabled) return;
        if (b.hasAttribute("data-home")) {
          current = null;
          showReview = false;
          render();
          goTop();
        } else if (b.hasAttribute("data-open")) {
          current = b.dataset.open;
          showReview = false;
          render();
          goTop();
        } else if (b.hasAttribute("data-summary")) {
          showReview = true;
          render();
          goTop();
        } else if (b.hasAttribute("data-try")) {
          dispatch({ type: "TRY", index: Number(b.dataset.try) });
        } else if (b.hasAttribute("data-verdict"))
          dispatch({ type: "VERDICT", value: b.dataset.verdict });
        else if (b.hasAttribute("data-choice"))
          dispatch({ type: "CHOICE", value: b.dataset.choice });
        else if (b.hasAttribute("data-reset")) {
          dispatch({ type: "RESET" });
          goTop();
        } else if (b.hasAttribute("data-view"))
          dispatch({ type: "VIEW", value: b.dataset.view });
        else if (b.hasAttribute("data-edit-original"))
          dispatch({ type: "EDIT_ORIGINAL" });
        else if (b.hasAttribute("data-select-review")) {
          $("reviewText").focus();
          $("reviewText").select();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.hasAttribute("data-check"))
          dispatch({
            type: "CHECK",
            index: Number(e.target.dataset.check),
            value: e.target.checked,
          });
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "feedback")
          dispatch({ type: "COMMENT", value: e.target.value });
        if (e.target.id === "noteText")
          dispatch({ type: "TEXT", value: e.target.value });
      });
      render();
    </script>
  </body>
</html>
