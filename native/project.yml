name: BookOrbit
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: NO
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
targets:
  BookOrbit:
    type: application
    platform: iOS
    sources:
      - path: BookOrbit/Sources

      - path: BookOrbit/Resources/Reader
        type: folder
      - path: BookOrbit/Resources/Notices
        type: folder
    info:
      path: BookOrbit/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mooneeb.bookorbit.reader
        INFOPLIST_KEY_CFBundleDisplayName: BookOrbit
  BookOrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BookOrbitTests]
    dependencies:
      - target: BookOrbit
schemes:
  BookOrbit:
    build:
      targets:
        BookOrbit: all
    test:
      targets: [BookOrbitTests]
